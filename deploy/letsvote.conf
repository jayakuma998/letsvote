# Apache virtual host for LetsVote.
# Install to /etc/httpd/conf.d/letsvote.conf on Amazon Linux 2023.
#
# The instances live in a private subnet and only ever receive plain HTTP on
# port 80 from the ALB. TLS is terminated at CloudFront and again at the ALB.

<VirtualHost *:80>
    DocumentRoot /var/www/letsvote/public

    <Directory /var/www/letsvote/public>
        # No .htaccess: keep configuration in one place and save a stat() per request.
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # src/, sql/, config/ and templates/ sit OUTSIDE the DocumentRoot, so they
    # are unreachable over HTTP by construction. Belt and braces anyway:
    <DirectoryMatch "^/var/www/letsvote/(src|sql|config|templates|deploy)">
        Require all denied
    </DirectoryMatch>

    # Show the real visitor IP in the access log instead of the ALB's private IP.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 172.16.0.0/16

    LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" alb
    ErrorLog /var/log/httpd/letsvote_error.log

    # The health check fires every few seconds from two AZs; keep it out of the log.
    SetEnvIf Request_URI "^/health\.php$" dontlog
    CustomLog /var/log/httpd/letsvote_access.log alb env=!dontlog
</VirtualHost>

# Do not advertise the exact Apache and PHP versions.
ServerTokens Prod
ServerSignature Off
