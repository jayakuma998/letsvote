; LetsVote configuration — EXAMPLE ONLY
;
; On EC2 the real file lives at /etc/letsvote/config.ini and is written at boot
; by deploy/userdata.sh from AWS Secrets Manager. It is owned by root:apache
; with mode 0640, so the web server can read it and nobody else can.
;
; NEVER commit a filled-in copy of this file.
;
; For local development:
;   cp config/config.example.ini config/config.local.ini   (gitignored)
;   LETSVOTE_CONFIG=config/config.local.ini php -S localhost:8000 -t public

[app]
; No trailing slash. Must match the Cognito callback URL exactly.
base_url = "https://letsvote.example"
; "production" hides error details from visitors; anything else shows them.
env = "production"

[db]
; RDS primary endpoint — all writes go here.
host      = "primary-db.abcdefghij.us-east-1.rds.amazonaws.com"
; RDS read replica endpoint — results and dashboards read from here.
; Leave empty to send every query to the primary.
host_read = "readreplica-db.abcdefghij.us-east-1.rds.amazonaws.com"
port      = 3306
name      = "letsvote"
; The application account, NOT the RDS master user.
user      = "letsvote_app"
pass      = "put-the-secrets-manager-password-here"

[cognito]
region        = "us-east-1"
user_pool_id  = "us-east-1_XXXXXXXXX"
client_id     = "xxxxxxxxxxxxxxxxxxxxxxxxxx"
; Leave empty if the app client was created without a secret.
client_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
; Hostname only — no https://, no trailing slash.
domain        = "letsvote-auth.auth.us-east-1.amazoncognito.com"
