<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustrated initials portrait: B T">
  <title>Bola Ahmed Tinubu — illustrated initials, not a photograph</title>
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8ad4"/>
      <stop offset="1" stop-color="#155a97"/>
    </linearGradient>
    <clipPath id="t-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#t-clip)">
    <rect width="200" height="200" fill="url(#t-bg)"/>
    <circle cx="34" cy="30" r="86" fill="#ffffff" opacity=".07"/>
    <circle cx="168" cy="178" r="62" fill="#000000" opacity=".08"/>
    <text x="100" y="100" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="76" font-weight="700" letter-spacing="2"
          text-anchor="middle" dominant-baseline="central">BT</text>
  </g>
  <circle cx="100" cy="100" r="98.5" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
</svg>
